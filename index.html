<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Bot V6 - Delta Testnet</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#111827}
main{max-width:700px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0}
input,button{font-size:16px;padding:12px;border-radius:10px;box-sizing:border-box}
input{width:100%;margin:5px 0 12px;border:1px solid #ddd}button{border:0;background:#2563eb;color:#fff;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}.danger{background:#dc2626}.green{background:#16a34a}
.muted{color:#666}.price{font-size:30px;font-weight:800}.note{background:#eef3ff;padding:12px;border-radius:12px;line-height:1.45}
</style>
</head>
<body><main>
<h1>Trading Bot V6</h1>
<div class="card">
<b>DELTA DEMO / TESTNET ONLY</b>
<p id="connection" class="muted">Not connected</p>
<div id="price" class="price">-</div>
<p id="product">Product: BTCUSD</p>
</div>
<div class="card">
<label>Product Symbol</label><input id="symbol" value="BTCUSD">
<label>Starting Quantity</label><input id="qty" type="number" min="0.000000000001" step="any" value="0.01">
<label>Target Points</label><input id="target" type="number" min="0.000000000001" step="any" value="500">
<label>Stop Loss Points</label><input id="sl" type="number" min="0.000000000001" step="any" value="250">
<label>Recovery Points</label><input id="recovery" type="number" min="0.000000000001" step="any" value="400">
<div class="row">
<button id="connect">CONNECT TESTNET PRICE</button>
<button id="start" class="green">START TEST</button>
<button id="stop" class="danger">STOP</button>
</div>
</div>
<div class="card">
<h3>Strategy State</h3><p id="strategy">Stopped. First call will be BUY.</p>
<div class="note"><b>Testnet only.</b> This browser page never stores API secrets and does not place authenticated orders. It verifies the public Demo/Testnet market feed first.</div>
</div>
</main>
<script>
let ws=null;
let state={running:false,dir:"BUY",qty:0.01,startQty:0.01,target:500,sl:250,recovery:400};
const $=id=>document.getElementById(id);
function render(){
  $("strategy").textContent=state.running
    ? state.dir+" "+state.qty+" | Target "+state.target+" | SL "+state.sl+" | Recovery "+state.recovery
    : "Stopped. First call will be BUY.";
}
$("connect").onclick=()=>{
  const symbol=$("symbol").value.trim().toUpperCase();
  if(!symbol){alert("Enter a product symbol.");return;}
  $("product").textContent="Product: "+symbol;
  if(ws)ws.close();
  ws=new WebSocket("wss://socket-ind-pub.testnet.deltaex.org");
  ws.onopen=()=>{
    $("connection").textContent="Connected to Delta Testnet public WebSocket";
    ws.send(JSON.stringify({type:"subscribe",payload:{channels:[{name:"v2/ticker",symbols:[symbol]}]}}));
  };
  ws.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      const p=m?.price??m?.mark_price??m?.close??m?.payload?.price??m?.payload?.mark_price??m?.payload?.close;
      if(p!=null)$("price").textContent=String(p);
    }catch(err){}
  };
  ws.onclose=()=>{$("connection").textContent="Testnet feed disconnected";};
  ws.onerror=()=>{$("connection").textContent="Testnet WebSocket error";};
};
$("start").onclick=()=>{
  const q=Number($("qty").value),t=Number($("target").value),s=Number($("sl").value),r=Number($("recovery").value);
  if(!(q>0&&t>0&&s>0&&r>0)){alert("Enter valid positive settings.");return;}
  state={running:true,dir:"BUY",qty:q,startQty:q,target:t,sl:s,recovery:r};render();
};
$("stop").onclick=()=>{state.running=false;state.dir="BUY";state.qty=state.startQty;render();};
render();
</script></body></html>
