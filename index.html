<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Trade Bot V2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f5f7;color:#111827}
main{max-width:680px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
h1{font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#666;display:block;margin-bottom:5px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:12px;font-weight:700;font-size:16px}.start{background:#16a34a;color:white}.stop{background:#dc2626;color:white}.blue{background:#2563eb;color:white}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#666}.trade{border-top:1px solid #eee;padding:10px 0}.levels{font-size:14px;color:#444;margin-top:6px}
</style></head><body><main>
<h1>📈 Paper Trade Bot V2</h1>
<div class="card"><div class="row"><span id="dot">⚪</span><b id="status">STOPPED</b>
<button id="toggle" class="start" onclick="toggle()">START</button></div>
<p>Direction: <b id="dir">BUY</b> · Quantity: <b id="qtyView">1</b></p></div>
<div class="card"><h3>Strategy Settings</h3><div class="grid">
<div><label>Market</label><input id="market" value="NSE"></div><div><label>Symbol</label><input id="symbol" value="NIFTY"></div>
<div><label>Starting Quantity</label><input id="qty" type="number" value="1" min="1"></div>
<div><label>Target Points</label><input id="target" type="number" value="500" min=".01"></div>
<div><label>Stop Loss Points</label><input id="sl" type="number" value="250" min=".01"></div>
<div><label>Recovery Move</label><input id="recovery" type="number" value="400" min=".01"></div>
<div><label>Loss Divisor</label><input id="divisor" type="number" value="4" min=".01"></div>
</div></div>
<div class="card"><h3>Paper Price</h3><input id="price" type="number" step=".01" placeholder="Enter price">
<div class="row" style="margin-top:10px"><button class="blue" onclick="openSignal()">Open Current Signal</button><button onclick="updatePrice()">Update Price / Check</button></div>
<div id="open" class="muted">No open trade.</div></div>
<div class="card"><h3>Trade Journal</h3><div id="journal" class="muted">No completed trades.</div>
<button class="blue" onclick="exportCSV()">Export CSV</button> <button onclick="clearAll()">Clear History</button></div>
</main>
<script>
const KEY='ptb_v2';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{running:false,dir:'BUY',qty:1,trades:[],open:null};
const $=id=>document.getElementById(id),num=id=>Number($(id).value);
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function render(){
 $('status').textContent=state.running?'RUNNING — PAPER ONLY':'STOPPED';$('dot').textContent=state.running?'🟢':'⚪';
 $('toggle').textContent=state.running?'STOP':'START';$('toggle').className=state.running?'stop':'start';
 $('dir').textContent=state.dir;$('qtyView').textContent=state.qty;
 if(state.open){let t=state.open;$('open').innerHTML='<b>'+t.direction+' '+t.quantity+' @ '+t.entry+'</b><div class="levels">Target: '+t.targetPrice+' | Stop Loss: '+t.stopLossPrice+'</div>'}
 else $('open').textContent='No open trade.';
 $('journal').innerHTML=state.trades.length?state.trades.slice().reverse().map(t=>'<div class="trade"><b>'+t.direction+' '+t.quantity+' — '+t.reason+'</b><br>Entry '+t.entry+' → Exit '+t.exit+' · P/L '+t.pnl.toFixed(2)+' points<div class="levels">Target '+t.targetPrice+' · SL '+t.stopLossPrice+' · Next qty '+t.nextQuantity+'</div><small>'+new Date(t.time).toLocaleString()+'</small></div>').join(''):'No completed trades.';
}
function toggle(){if(state.running){state.running=false;state.open=null;state.dir='BUY';state.qty=Math.max(1,Math.ceil(num('qty')||1))}
else{state.running=true;state.open=null;state.dir='BUY';state.qty=Math.max(1,Math.ceil(num('qty')||1))}save()}
function openSignal(){
 if(!state.running)return alert('Start the bot first.');if(state.open)return alert('A trade is already open.');
 let p=num('price');if(!Number.isFinite(p))return alert('Enter a valid price.');
 let target=num('target'),sl=num('sl'),rec=num('recovery'),div=num('divisor');
 if(target<=0||sl<=0||rec<=0||div<=0)return alert('Target, SL, Recovery Move and Loss Divisor must be greater than 0.');
 state.open={direction:state.dir,quantity:state.qty,entry:p,targetPrice:state.dir==='BUY'?p+target:p-target,stopLossPrice:state.dir==='BUY'?p-sl:p+sl,targetPoints:target,stopLossPoints:sl,recoveryMove:rec,lossDivisor:div,market:$('market').value.trim(),symbol:$('symbol').value.trim(),time:Date.now()};save()
}
function updatePrice(){
 if(!state.running||!state.open)return alert('No open paper trade.');
 let p=num('price');if(!Number.isFinite(p))return alert('Enter a valid price.');let t=state.open,reason=null;
 /* FIX: explicit direction-specific SL/target checks; SL is checked first at exact levels */
 if(t.direction==='BUY'){if(p<=t.stopLossPrice)reason='STOP LOSS';else if(p>=t.targetPrice)reason='TARGET'}
 else{if(p>=t.stopLossPrice)reason='STOP LOSS';else if(p<=t.targetPrice)reason='TARGET'}
 if(!reason)return alert('No exit yet. Target: '+t.targetPrice+' | Stop Loss: '+t.stopLossPrice);
 let points=t.direction==='BUY'?p-t.entry:t.entry-p,pnl=points*t.quantity,additional=0;
 if(reason==='STOP LOSS')additional=Math.ceil((Math.abs(pnl)/t.lossDivisor)/t.recoveryMove);
 let next=t.quantity+additional;
 state.trades.push({time:Date.now(),market:t.market,symbol:t.symbol,direction:t.direction,quantity:t.quantity,entry:t.entry,exit:p,targetPrice:t.targetPrice,stopLossPrice:t.stopLossPrice,reason,pnl,additionalQuantity:additional,nextQuantity:next});
 state.qty=next;state.dir=t.direction==='BUY'?'SELL':'BUY';state.open=null;save()
}
function exportCSV(){
 let rows=['timestamp,symbol,market,direction,quantity,entry_price,exit_price,target_price,stop_loss_price,reason,pnl,additional_quantity,next_quantity'];
 state.trades.forEach(t=>rows.push([new Date(t.time).toISOString(),t.symbol,t.market,t.direction,t.quantity,t.entry,t.exit,t.targetPrice,t.stopLossPrice,t.reason,t.pnl,t.additionalQuantity,t.nextQuantity].join(',')));
 let blob=new Blob([rows.join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paper_trade_journal.csv';a.click();
}
function clearAll(){if(confirm('Delete all paper trade history?')){state={running:false,dir:'BUY',qty:Math.max(1,Math.ceil(num('qty')||1)),trades:[],open:null};save()}}
render();
</script></body></html>
