<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Paper Trade Bot</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f5f7;color:#111827}
main{max-width:680px;margin:auto;padding:18px 14px 40px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
h1{font-size:28px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#666;display:block;margin-bottom:5px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:12px;font-weight:700;font-size:16px}
.start{background:#16a34a;color:white}.stop{background:#dc2626;color:white}.blue{background:#2563eb;color:white}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{font-weight:700}.muted{color:#666}
.trade{border-top:1px solid #eee;padding:10px 0}
</style>
</head>
<body><main>
<h1>📈 Paper Trade Bot</h1>
<div class="card">
<div class="row"><span id="dot">⚪</span><span class="status" id="status">STOPPED</span>
<button id="toggle" class="start" onclick="toggle()">START</button></div>
<p>Direction: <b id="dir">BUY</b> · Quantity: <b id="qtyView">1</b></p>
</div>

<div class="card"><h3>Strategy Settings</h3>
<div class="grid">
<div><label>Market</label><input id="market" value="NSE"></div>
<div><label>Symbol</label><input id="symbol" value="NIFTY"></div>
<div><label>Starting Quantity</label><input id="qty" type="number" value="1" min="1"></div>
<div><label>Target Points</label><input id="target" type="number" value="500"></div>
<div><label>Stop Loss Points</label><input id="sl" type="number" value="250"></div>
<div><label>Recovery Move</label><input id="recovery" type="number" value="400"></div>
<div><label>Loss Divisor</label><input id="divisor" type="number" value="4"></div>
</div></div>

<div class="card"><h3>Paper Price</h3>
<input id="price" type="number" step="0.01" placeholder="Enter price">
<div class="row" style="margin-top:10px">
<button class="blue" onclick="openSignal()">Open Current Signal</button>
<button onclick="updatePrice()">Update Price / Check</button>
</div>
<p class="muted" id="open">No open trade.</p>
</div>

<div class="card"><h3>Trade Journal</h3>
<div id="journal" class="muted">No completed trades.</div>
<button class="blue" onclick="exportCSV()">Export CSV</button>
<button onclick="clearAll()">Clear History</button>
</div>
</main>
<script>
const S='ptb_v1';
let state=JSON.parse(localStorage.getItem(S)||'null')||{
 running:false,dir:'BUY',qty:1,trades:[],open:null
};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(S,JSON.stringify(state));render()}
function n(id){return Number($(id).value)}
function settings(){return{market:$('market').value,symbol:$('symbol').value,target:n('target'),sl:n('sl'),recovery:n('recovery'),divisor:n('divisor')}}
function render(){
 $('status').textContent=state.running?'RUNNING — PAPER ONLY':'STOPPED';
 $('dot').textContent=state.running?'🟢':'⚪';
 $('toggle').textContent=state.running?'STOP':'START';
 $('toggle').className=state.running?'stop':'start';
 $('dir').textContent=state.dir;$('qtyView').textContent=state.qty;
 $('open').textContent=state.open?`${state.open.dir} ${state.open.qty} @ ${state.open.entry} | Target ${state.open.target} | SL ${state.open.sl}`:'No open trade.';
 $('journal').innerHTML=state.trades.length?state.trades.slice().reverse().map(t=>`<div class="trade"><b>${t.direction} ${t.quantity} — ${t.reason}</b><br>Entry ${t.entry} → Exit ${t.exit} · P/L ₹${t.pnl.toFixed(2)}<br>Next quantity: ${t.nextQuantity} · ${new Date(t.time).toLocaleString()}</div>`).join(''):'No completed trades.';
}
function toggle(){
 if(state.running){state.running=false;state.open=null;state.dir='BUY';state.qty=n('qty')||1}
 else{state.running=true;state.dir='BUY';state.qty=n('qty')||1;state.open=null}
 save();
}
function openSignal(){
 if(!state.running||state.open)return alert('Start the bot and make sure there is no open trade.');
 let p=n('price');if(!p)return alert('Enter a price.');
 let s=settings();
 state.open={dir:state.dir,qty:state.qty,entry:p,target:state.dir==='BUY'?p+s.target:p-s.target,sl:state.dir==='BUY'?p-s.sl:p+s.sl,time:Date.now(),...s};
 save();
}
function updatePrice(){
 if(!state.running||!state.open)return alert('No open paper trade.');
 let p=n('price'),t=state.open;
 let hitTarget=t.dir==='BUY'?p>=t.target:p<=t.target;
 let hitSL=t.dir==='BUY'?p<=t.sl:p>=t.sl;
 if(!hitTarget&&!hitSL)return alert('Neither Target nor SL hit.');
 let reason=hitTarget?'TARGET':'STOP LOSS';
 let points=t.dir==='BUY'?p-t.entry:t.entry-p;
 let pnl=points*t.qty;
 let add=reason==='STOP LOSS'?Math.ceil(Math.abs(pnl)/t.divisor/t.recovery):0;
 let next=t.qty+add;
 state.trades.push({time:Date.now(),direction:t.dir,quantity:t.qty,entry:t.entry,exit:p,reason,pnl,additionalQuantity:add,nextQuantity:next});
 state.qty=next;state.dir=t.dir==='BUY'?'SELL':'BUY';state.open=null;
 save();
}
function exportCSV(){
 let rows=['timestamp,symbol,market,direction,quantity,entry_price,exit_price,reason,pnl,additional_quantity,next_quantity'];
 for(let t of state.trades) rows.push([new Date(t.time).toISOString(),state.trades.length?settings().symbol:'',settings().market,t.direction,t.quantity,t.entry,t.exit,t.reason,t.pnl,t.additionalQuantity,t.nextQuantity].join(','));
 let blob=new Blob([rows.join('\\n')],{type:'text/csv'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paper_trade_journal.csv';a.click();
}
function clearAll(){if(confirm('Delete all paper trade history?')){state.trades=[];save()}}
render();
</script></body></html>
